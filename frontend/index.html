<!doctype html>
<html lang="en" class="h-full antialiased selection:bg-red-500/30 selection:text-red-900 dark:selection:text-white">
  <head>
    <!-- Anti-flash: apply theme before first paint -->
    <script>
      (function() {
        var stored = localStorage.getItem('aurachat_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ED1C24%22 rx=%2220%22/><text y=%22.9em%22 x=%22.1em%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2280%22 fill=%22white%22>A</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMDChat</title>
    <meta name="description" content="A real-time chat application connecting minds." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="h-full overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
